<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>Iris Outpost — Lo-Fi Radio</title>
<link rel="stylesheet" href="./static/style.css">
</head>
<body>
<main class="station">
  <header class="station-header">
    <div>
      <div class="eyebrow">REMOTE OUTPOST // DEEP SPACE</div>
      <h1>Iris Outpost Radio</h1>
    </div>
    <div class="status"><span></span> QUIET HOURS</div>
  </header>

  <section class="scene" aria-label="Iris at the remote outpost">
    <div class="iris-frames">
      <img src="./static/assets/img/frame1.png" alt="Iris looking out over the forest planet" class="iris-frame frame-1">
      <img src="./static/assets/img/frame2.png" alt="Iris reading in the outpost library" class="iris-frame frame-2">
      <img src="./static/assets/img/frame3.png" alt="Iris resting with her mug beside the window" class="iris-frame frame-3">
    </div>
  </section>

  <section class="player" aria-label="Music player">
    <audio id="player-audio" preload="metadata"></audio>
    <div class="track">
      <div class="track-label">NOW PLAYING</div>
      <div id="player-title" class="track-title">No music selected</div>
      <div id="player-count" class="track-count"></div>
    </div>
    <div class="controls">
      <button id="player-prev" type="button" title="Previous">⏮</button>
      <button id="player-play" class="play" type="button" title="Play / pause">▶</button>
      <button id="player-next" type="button" title="Next">⏭</button>
      <button id="player-loop" class="active" type="button" title="Loop playlist">↻</button>
      <label class="volume" title="Volume">🔊 <input id="player-volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="Volume"></label>
    </div>
    <div class="music-import">
      <label class="import-button">
        <input id="music-files" type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" multiple>
        + ADD MP3s
      </label>
      <label class="import-button secondary">
        <input id="music-folder" type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" multiple webkitdirectory directory>
        + ADD FOLDER
      </label>
    </div>
  </section>

  <p id="player-message" class="message">Choose some music from your phone. The files stay on your device.</p>

  <footer>
    <span>study / read / work</span><span>·</span><span>do not disturb the outpost</span>
  </footer>
</main>
<script src="./static/player.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
}
</script>
</body>
</html>
